version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - decorder
    - wsl_v5
  settings:
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
      disable-dec-order-check: false
    wsl_v5:
      default: default
      enable:
        - after-block
  exclusions:
    rules:
      # cgo declares variables after each //export function, past the end of the source.
      - path: ui/ui.go
        linters:
          - decorder
        text: "var must not be placed after func"

formatters:
  enable:
    - gofmt
